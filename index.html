<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0f0e0c;
      --paper:     #f5f2ec;
      --cream:     #ede9e0;
      --accent:    #c84b2f;
      --accent2:   #2f6ec8;
      --muted:     #8a8578;
      --border:    #d4cfc6;
      --radius:    6px;
      --mono:      'DM Mono', monospace;
      --serif:     'Instrument Serif', Georgia, serif;
      --sans:      'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 56px 1fr;
      height: 100vh;
    }

    /* ── Header ────────────────────────────────── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: var(--paper);
      gap: 10px;
    }

    .logo-mark {
      width: 28px; height: 28px;
      background: var(--ink);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-mark svg { width: 14px; height: 14px; fill: var(--paper); }

    .logo-text {
      font-family: var(--serif);
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    .logo-text em {
      font-style: italic;
      color: var(--accent);
    }

    header .spacer { flex: 1; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #aaa;
      transition: background .3s;
    }
    .status-dot.online { background: #4caf50; }
    .status-label {
      font-size: .75rem;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Sidebar ───────────────────────────────── */
    aside {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--cream);
    }

    .sidebar-section {
      padding: 20px 20px 0;
    }

    .sidebar-label {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Upload zone */
    .upload-zone {
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      background: transparent;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(200, 75, 47, .04);
    }
    .upload-zone input[type=file] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }
    .upload-text {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .upload-text strong { color: var(--ink); font-weight: 500; }

    /* Upload progress */
    .upload-progress {
      display: none;
      margin-top: 10px;
    }
    .upload-progress.visible { display: block; }
    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .3s;
    }
    .progress-label {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
    }

    /* Document list */
    .doc-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .doc-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background .15s;
      border: 1px solid transparent;
      margin-bottom: 6px;
    }
    .doc-item:hover { background: rgba(0,0,0,.04); }
    .doc-item.active {
      background: var(--paper);
      border-color: var(--border);
    }

    .doc-icon {
      width: 32px; height: 32px;
      border-radius: 4px;
      background: var(--ink);
      color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-size: .6rem;
      font-weight: 500;
      flex-shrink: 0;
      letter-spacing: .04em;
    }

    .doc-meta { flex: 1; min-width: 0; }
    .doc-name {
      font-size: .82rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .doc-status {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      margin-top: 1px;
    }
    .doc-status.ready { color: #4caf50; }
    .doc-status.error { color: var(--accent); }

    .doc-empty {
      text-align: center;
      color: var(--muted);
      font-size: .82rem;
      padding: 24px 0;
      font-style: italic;
      font-family: var(--serif);
    }

    /* ── Chat area ─────────────────────────────── */
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
    }

    .chat-header-title {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      color: var(--muted);
    }
    .chat-header-title.has-doc {
      color: var(--ink);
      font-style: normal;
    }

    .scope-badge {
      font-family: var(--mono);
      font-size: .68rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--ink);
      color: var(--paper);
      letter-spacing: .04em;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      display: flex;
      gap: 14px;
      animation: fadeUp .3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem;
      font-weight: 500;
    }

    .message.user .message-avatar {
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
    }

    .message.assistant .message-avatar {
      background: var(--accent);
      color: white;
      font-family: var(--serif);
      font-style: italic;
      font-size: .9rem;
    }

    .message-body { flex: 1; min-width: 0; }

    .message-role {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .message-text {
      font-size: .9rem;
      line-height: 1.7;
      color: var(--ink);
    }

    .message.user .message-text {
      font-weight: 500;
    }

    /* Sources */
    .sources {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sources-label {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .source-chip {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.5;
      position: relative;
      cursor: default;
    }

    .source-chip .source-page {
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--accent2);
      margin-bottom: 3px;
    }

    .source-chip .source-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--ink);
    }

    /* Thinking indicator */
    .thinking {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .thinking-dots {
      display: flex; gap: 4px; padding-top: 6px;
    }
    .thinking-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .thinking-dots span:nth-child(2) { animation-delay: .2s; }
    .thinking-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(.8); opacity: .5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      gap: 12px;
      padding: 40px;
      text-align: center;
    }

    .empty-state .big-text {
      font-family: var(--serif);
      font-size: 1.8rem;
      font-style: italic;
      color: var(--border);
      line-height: 1.2;
    }

    .empty-state p {
      font-size: .85rem;
      max-width: 280px;
    }

    /* Input */
    .input-area {
      border-top: 1px solid var(--border);
      padding: 16px 28px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--paper);
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: var(--sans);
      font-size: .88rem;
      line-height: 1.5;
      resize: none;
      background: white;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
      min-height: 44px;
      max-height: 120px;
    }
    textarea:focus { border-color: var(--ink); }
    textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--paper);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #333; }
    .send-btn:active { transform: scale(.95); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; }

    .input-hint {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo-mark">
      <svg viewBox="0 0 16 16"><path d="M3 2h7l3 3v9H3V2zm7 0v3h3"/></svg>
    </div>
    <span class="logo-text">Docu<em>Chat</em></span>
    <div class="spacer"></div>
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">connecting…</span>
  </header>

  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section" style="padding-bottom:16px">
      <div class="sidebar-label">Upload PDF</div>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".pdf" />
        <div class="upload-icon">📄</div>
        <div class="upload-text">
          <strong>Click or drag</strong> a PDF here
        </div>
      </div>
      <div class="upload-progress" id="uploadProgress">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-label" id="progressLabel">Uploading…</div>
      </div>
    </div>

    <div style="padding: 0 20px 8px">
      <div class="sidebar-label">Documents</div>
    </div>
    <div class="doc-list" id="docList">
      <div class="doc-empty">No documents yet.<br/>Upload a PDF to begin.</div>
    </div>
  </aside>

  <!-- Main chat -->
  <main>
    <div class="chat-header">
      <span class="chat-header-title" id="chatTitle" style="font-style:italic;color:var(--muted)">Select a document to start chatting</span>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="big-text">Ask anything<br/>about your docs</div>
        <p>Upload a PDF on the left, then ask questions and get answers grounded in the content.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="questionInput"
          placeholder="Ask a question about your document…"
          rows="1"
          disabled
        ></textarea>
        <div class="input-hint" id="inputHint">Select a document first</div>
      </div>
      <button class="send-btn" id="sendBtn" disabled title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </main>

</div>

<script>
  const API = 'http://localhost:3030';

  // State
  let documents = [];
  let activeDocId = null;
  let polling = {};

  // Elements
  const fileInput     = document.getElementById('fileInput');
  const uploadZone    = document.getElementById('uploadZone');
  const uploadProgress = document.getElementById('uploadProgress');
  const progressFill  = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const docList       = document.getElementById('docList');
  const messages      = document.getElementById('messages');
  const emptyState    = document.getElementById('emptyState');
  const questionInput = document.getElementById('questionInput');
  const sendBtn       = document.getElementById('sendBtn');
  const chatTitle     = document.getElementById('chatTitle');
  const inputHint     = document.getElementById('inputHint');
  const statusDot     = document.getElementById('statusDot');
  const statusLabel   = document.getElementById('statusLabel');

  // ── Server health check ───────────────────────
  async function checkHealth() {
    try {
      await fetch(`${API}/documents`);
      statusDot.classList.add('online');
      statusLabel.textContent = 'connected';
    } catch {
      statusDot.classList.remove('online');
      statusLabel.textContent = 'offline';
    }
  }
  checkHealth();

  // ── Upload ────────────────────────────────────
  uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) uploadFile(fileInput.files[0]);
    fileInput.value = '';
  });

  async function uploadFile(file) {
    if (!file.name.endsWith('.pdf')) {
      alert('Only PDF files are supported.');
      return;
    }

    uploadProgress.classList.add('visible');
    progressFill.style.width = '30%';
    progressLabel.textContent = 'Uploading…';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const res = await fetch(`${API}/documents`, { method: 'POST', body: formData });
      const doc = await res.json();

      progressFill.style.width = '60%';
      progressLabel.textContent = 'Processing…';

      addDocument(doc);
      pollStatus(doc.id);
    } catch (err) {
      progressLabel.textContent = 'Upload failed.';
      console.error(err);
    }
  }

  function pollStatus(id) {
    if (polling[id]) return;
    polling[id] = setInterval(async () => {
      try {
        const res = await fetch(`${API}/documents/${id}`);
        const doc = await res.json();
        updateDocument(doc);
        if (doc.status === 'ready' || doc.status === 'error') {
          clearInterval(polling[id]);
          delete polling[id];
          if (doc.status === 'ready') {
            progressFill.style.width = '100%';
            progressLabel.textContent = `Ready — ${doc.chunkCount} chunks indexed`;
            setTimeout(() => uploadProgress.classList.remove('visible'), 2000);
          }
        }
      } catch {}
    }, 1500);
  }

  // ── Document list ─────────────────────────────
  function addDocument(doc) {
    documents.unshift(doc);
    renderDocList();
  }

  function updateDocument(doc) {
    const idx = documents.findIndex(d => d.id === doc.id);
    if (idx !== -1) documents[idx] = doc;
    renderDocList();
  }

  function renderDocList() {
    if (documents.length === 0) {
      docList.innerHTML = '<div class="doc-empty">No documents yet.<br/>Upload a PDF to begin.</div>';
      return;
    }

    docList.innerHTML = documents.map(doc => `
      <div class="doc-item ${doc.id === activeDocId ? 'active' : ''}" data-id="${doc.id}">
        <div class="doc-icon">PDF</div>
        <div class="doc-meta">
          <div class="doc-name">${escHtml(doc.originalName)}</div>
          <div class="doc-status ${doc.status}">${statusText(doc)}</div>
        </div>
      </div>
    `).join('');

    docList.querySelectorAll('.doc-item').forEach(el => {
      el.addEventListener('click', () => selectDocument(el.dataset.id));
    });
  }

  function statusText(doc) {
    if (doc.status === 'processing') return '⟳ processing…';
    if (doc.status === 'ready') return `✓ ${doc.chunkCount} chunks`;
    if (doc.status === 'error') return '✗ error';
    return doc.status;
  }

  function selectDocument(id) {
    const doc = documents.find(d => d.id === id);
    if (!doc) return;
    activeDocId = id;
    renderDocList();

    chatTitle.textContent = doc.originalName;
    chatTitle.className = 'chat-header-title has-doc';

    if (doc.status === 'ready') {
      questionInput.disabled = false;
      sendBtn.disabled = false;
      inputHint.textContent = 'Press Enter to send, Shift+Enter for new line';
      questionInput.focus();
    } else {
      questionInput.disabled = true;
      sendBtn.disabled = true;
      inputHint.textContent = 'Document is still processing…';
    }
  }

  // ── Chat ──────────────────────────────────────
  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  questionInput.addEventListener('input', () => {
    questionInput.style.height = 'auto';
    questionInput.style.height = Math.min(questionInput.scrollHeight, 120) + 'px';
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage() {
    const question = questionInput.value.trim();
    if (!question || !activeDocId) return;

    hideEmptyState();
    appendMessage('user', question);
    questionInput.value = '';
    questionInput.style.height = 'auto';
    sendBtn.disabled = true;
    questionInput.disabled = true;

    const thinkingEl = appendThinking();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, documentId: activeDocId }),
      });
      const data = await res.json();
      thinkingEl.remove();
      appendMessage('assistant', data.answer, data.sources);
    } catch (err) {
      thinkingEl.remove();
      appendMessage('assistant', '⚠ Could not reach the server. Is it running?');
    } finally {
      sendBtn.disabled = false;
      questionInput.disabled = false;
      questionInput.focus();
    }
  }

  function hideEmptyState() {
    if (emptyState) emptyState.style.display = 'none';
  }

  function appendMessage(role, text, sources) {
    const el = document.createElement('div');
    el.className = `message ${role}`;

    const avatar = role === 'user' ? 'you' : 'D';
    let sourcesHtml = '';

    if (sources && sources.length > 0) {
      sourcesHtml = `
        <div class="sources">
          <div class="sources-label">Sources</div>
          ${sources.slice(0, 3).map(s => `
            <div class="source-chip">
              ${s.page != null ? `<div class="source-page">Page ${s.page}</div>` : ''}
              <div class="source-text">${escHtml(s.text)}</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    el.innerHTML = `
      <div class="message-avatar">${avatar}</div>
      <div class="message-body">
        <div class="message-role">${role === 'user' ? 'You' : 'DocuChat'}</div>
        <div class="message-text">${escHtml(text)}</div>
        ${sourcesHtml}
      </div>
    `;

    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function appendThinking() {
    const el = document.createElement('div');
    el.className = 'thinking';
    el.innerHTML = `
      <div class="message-avatar" style="background:var(--accent);color:white;font-family:var(--serif);font-style:italic;font-size:.9rem;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;">D</div>
      <div class="thinking-dots">
        <span></span><span></span><span></span>
      </div>
    `;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
